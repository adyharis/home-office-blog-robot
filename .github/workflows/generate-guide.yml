name: Generate Buyer's Guide

on:
  schedule:
    - cron: "0 8 */3 * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run guide generator
        env:
          NVIDIA_API_KEY:     ${{ secrets.NVIDIA_API_KEY }}
          AMAZON_TAG:         ${{ secrets.AMAZON_TAG }}
          BLOGGER_EMAIL:      ${{ secrets.BLOGGER_EMAIL }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python generate_guide.py

      - name: Commit and push generated post
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add posts/
          git diff --cached --quiet || git commit -m "Auto-generated buyer's guide for $(date +'%Y-%m-%d')"
          git push
